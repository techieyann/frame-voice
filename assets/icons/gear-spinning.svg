<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 72 72" role="img" aria-labelledby="title desc"><title id="title">Frame Voice processing</title><desc id="desc">A blue gear inside a fixed white top-left frame corner.</desc><defs><mask id="hub"><rect width="72" height="72" fill="white"/><circle cx="40" cy="40" r="5.5" fill="black"/></mask></defs><path d="M14 58V14H58" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g><animateTransform attributeName="transform" type="rotate" from="0 40 40" to="360 40 40" dur="2s" repeatCount="indefinite"/><g fill="#1A9FFF" mask="url(#hub)"><circle cx="40" cy="40" r="11.5"/><rect x="50" y="37.2" width="6" height="5.6" transform="rotate(0 40 40)"/><rect x="50" y="37.2" width="6" height="5.6" transform="rotate(45 40 40)"/><rect x="50" y="37.2" width="6" height="5.6" transform="rotate(90 40 40)"/><rect x="50" y="37.2" width="6" height="5.6" transform="rotate(135 40 40)"/><rect x="50" y="37.2" width="6" height="5.6" transform="rotate(180 40 40)"/><rect x="50" y="37.2" width="6" height="5.6" transform="rotate(225 40 40)"/><rect x="50" y="37.2" width="6" height="5.6" transform="rotate(270 40 40)"/><rect x="50" y="37.2" width="6" height="5.6" transform="rotate(315 40 40)"/></g></g></svg>
